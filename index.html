<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindCal</title>

<style>

:root{
    --baby:#bfe8f5;
    --baby2:#eaf8fc;
    --navy:#102a43;
    --navy2:#243b53;
    --white:#ffffff;
    --gray:#627d98;
    --border:#d7e8ef;
    --green:#4caf7a;
    --red:#d9534f;
    --priority-must:#e5484d;
    --priority-could:#f2b705;
    --priority-none:#c4d1dc;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--baby2);
    color:var(--navy);
}

/* HEADER */

header{
    background:var(--navy);
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.75;
}

header button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:94%;
    max-width:1300px;
    margin:25px auto;
}

.layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.card{
    min-width:0;
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 25px rgba(16,42,67,.08);
}

/* CALENDAR */

.calendar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar-top h2{
    margin:0;
}

.nav button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.weekdays,
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.weekday{
    text-align:center;
    font-size:12px;
    font-weight:bold;
    color:var(--gray);
    padding:8px 0;
}

.day{
    min-height:105px;
    border:1px solid var(--border);
    padding:6px;
    cursor:pointer;
    background:white;
    touch-action:none;
    user-select:none;
}

.day:hover{
    background:var(--baby2);
}

.day.today{
    background:#f0fbfe;
}

.day.selected{
    outline:3px solid var(--baby);
}

.day.drag-range{
    background:var(--baby);
    outline:2px dashed var(--navy);
    outline-offset:-2px;
}

.day-number{
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.event{
    font-size:10px;
    padding:4px;
    margin:3px 0;
    border-radius:5px;
    background:var(--baby);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.event.completed{
    text-decoration:line-through;
    opacity:.5;
}

.event.cancelled{
    text-decoration:line-through;
    opacity:.35;
}

.event.priority-must{
    border-left:3px solid var(--priority-must);
}

.event.priority-could{
    border-left:3px solid var(--priority-could);
}

.event.priority-none{
    border-left:3px solid var(--priority-none);
}

/* ADD BUTTON */

.add-event{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--navy);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.add-event:hover{
    background:var(--navy2);
}

/* EVENTS */

.event-card{
    background:#f6fbfd;
    border:1px solid var(--border);
    border-left:4px solid var(--priority-none);
    padding:12px;
    border-radius:11px;
    margin-bottom:10px;
}

.event-card.priority-must{
    border-left-color:var(--priority-must);
}

.event-card.priority-could{
    border-left-color:var(--priority-could);
}

.event-card.priority-none{
    border-left-color:var(--priority-none);
}

.priority-badge{
    display:inline-block;
    font-size:11px;
    font-weight:bold;
    padding:2px 8px;
    border-radius:20px;
    background:var(--baby2);
    margin-bottom:6px;
}

.event-card h4{
    margin:0 0 5px;
}

.event-info{
    font-size:12px;
    color:var(--gray);
    margin-bottom:8px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

    .edit{
    background:#dceffc;
    color:var(--navy);
}
    
.actions button{
    border:0;
    border-radius:7px;
    padding:6px 9px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.complete{
    background:#ddf5e8;
    color:#217346;
}

.move{
    background:var(--baby);
    color:var(--navy);
}

.cancel{
    background:#fff0ef;
    color:var(--red);
}

.delete{
    background:#eeeeee;
}

/* BRAIN DUMP */

textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
}

.save-dump{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.message{
    font-size:12px;
    color:var(--green);
    margin-top:7px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(16,42,67,.55);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:18px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin-top:0;
}

.close{
    border:0;
    background:none;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:10px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
}

textarea{
    font-family:Arial,sans-serif;
}

.save-event{
    width:100%;
    border:0;
    background:var(--navy);
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.audio-preview{
    width:100%;
    margin-top:8px;
}

.empty{
    text-align:center;
    color:var(--gray);
    padding:20px;
    font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:600px){

    .container{
        width:100%;
        margin:0 auto;
        padding:0 10px;
    }

    header{
        flex-direction:column;
        align-items:flex-start;
        padding:16px 5%;
    }

    .card{
        padding:14px;
        border-radius:14px;
    }

    /* Calendar top bar: title gets its own
       centered row, nav + Today sit below it
       with room to breathe instead of being
       squeezed into wrapping mid-button. */

    .calendar-top{
        flex-wrap:wrap;
        row-gap:10px;
    }

    .calendar-top h2{
        order:-1;
        width:100%;
        text-align:center;
        font-size:19px;
    }

    .nav{
        flex-shrink:0;
    }

    .nav button{
        min-height:40px;
        min-width:40px;
        padding:8px 14px;
    }

    #todayButton{
        min-height:40px;
    }

    /* View switcher: wrap instead of
       squeezing four buttons into one row. */

    .view-switcher{
        flex-wrap:wrap;
    }

    .view-button{
        flex:1;
        min-width:70px;
        min-height:40px;
        padding:8px 10px;
        font-size:13px;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .day{
        min-height:60px;
        padding:4px;
    }

    .day-number{
        font-size:11px;
    }

    .event{
        font-size:8.5px;
        padding:3px;
    }

    /* Bigger, easier-to-tap action buttons
       on event cards. */

    .actions button{
        min-height:36px;
        padding:8px 10px;
        font-size:12px;
    }

    /* Habit tracker: slightly larger check
       cells so they're easier to tap, and a
       modal-friendly add-habit row. */

    .habit-check{
        width:26px;
        height:26px;
    }

    .habit-add-row{
        flex-direction:column;
        align-items:stretch;
    }

    .habit-add-row select{
        width:100%;
    }

    /* Week/Day hourly grid: narrower time
       column frees up room for the actual
       schedule on a small screen. */

    .week-calendar{
        grid-template-columns:52px repeat(7, minmax(70px, 1fr));
    }

    .day-calendar{
        grid-template-columns:60px 1fr;
    }

    .week-time{
        font-size:10px;
        padding:6px 4px;
    }

    .week-day-header{
        font-size:11px;
        padding:6px 4px;
    }

    .week-event{
        font-size:9px;
        padding:3px;
    }

    /* Modal: less padding, no wasted space
       around the edges on a small screen. */

    .modal{
        padding:8px;
    }

    .modal-box{
        padding:16px;
        border-radius:14px;
    }

    input,
    select,
    textarea{
        font-size:16px;
        /* 16px prevents iOS Safari from
           automatically zooming in when a
           field is focused. */
    }

    .save-event,
    .add-event,
    .smart-schedule{
        min-height:44px;
    }

}

@media(max-width:400px){

    .day{
        min-height:48px;
    }

    .event{
        font-size:8px;
        padding:2px;
        margin:2px 0;
    }

    .view-button{
        font-size:12px;
        min-width:0;
    }

}

    .day-selector{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.day-option{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--baby2);
    border:1px solid var(--border);
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.day-option input{
    width:auto;
}


/* WEEK VIEW */

.view-switcher{
    display:flex;
    gap:6px;
    margin-bottom:15px;
}

.view-button{
    border:1px solid var(--border);
    background:white;
    color:var(--navy);
    padding:8px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
}

.view-button.active{
    background:var(--navy);
    color:white;
}

    /* WEEKLY CALENDAR */

.week-calendar{
    display:grid;
    grid-template-columns:70px repeat(7, 1fr);
    border:1px solid var(--border);
    overflow-x:auto;
}

.week-time{
    min-height:60px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:8px;
    font-size:11px;
    color:var(--gray);
    background:#f8fcfd;
}

.week-day-header{
    min-height:55px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:8px;
    text-align:center;
    font-size:12px;
    font-weight:bold;
    background:var(--baby2);
}

.week-cell{
    min-height:60px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:3px;
    cursor:pointer;
    background:white;
    touch-action:none;
    user-select:none;
}

.week-cell:hover{
    background:var(--baby2);
}

.week-cell.drag-range{
    background:var(--baby);
    outline:2px dashed var(--navy);
    outline-offset:-2px;
}

.week-event{
    background:var(--baby);
    border-radius:6px;
    padding:5px;
    margin:2px 0;
    font-size:10px;
    overflow:hidden;
}

.week-event.completed{
    text-decoration:line-through;
    opacity:.5;
}

.week-event.cancelled{
    text-decoration:line-through;
    opacity:.35;
}

.week-event.priority-must{
    border-left:3px solid var(--priority-must);
}

.week-event.priority-could{
    border-left:3px solid var(--priority-could);
}

.week-event.priority-none{
    border-left:3px solid var(--priority-none);
}

/* DEDICATED (NON-HOURLY) WEEK SECTIONS */

.week-section-cell{
    min-height:34px;
    border-right:1px solid var(--border);
    border-bottom:1px solid var(--border);
    padding:4px;
    cursor:pointer;
    background:white;
}

.week-section-cell:hover{
    background:var(--baby2);
}

.week-section-group{
    margin-bottom:4px;
}

.week-section-group:last-child{
    margin-bottom:0;
}

.week-section-label{
    font-size:9px;
    font-weight:bold;
    color:var(--gray);
    text-transform:uppercase;
    letter-spacing:.3px;
    margin-bottom:2px;
}

.week-timed-divider{
    grid-column:1 / -1;
    background:var(--navy);
    color:white;
    font-size:12px;
    font-weight:bold;
    padding:8px 10px;
    letter-spacing:.3px;
}

/* DAILY VIEW */

.day-calendar{
    display:grid;
    grid-template-columns:90px 1fr;
    border:1px solid var(--border);
    overflow-x:auto;
}

/* HABIT TRACKER */

.habit-tracker{
    overflow-x:auto;
}

.habit-add-row{
    display:flex;
    gap:8px;
    margin-bottom:16px;
    flex-wrap:wrap;
}

.habit-add-row input[type="text"]{
    flex:1;
    min-width:140px;
}

.habit-add-row select{
    width:auto;
}

.habit-add-row button{
    border:0;
    background:var(--navy);
    color:white;
    padding:10px 14px;
    border-radius:9px;
    font-weight:bold;
    cursor:pointer;
    white-space:nowrap;
}

.habit-add-row button:hover{
    background:var(--navy2);
}

.habit-table{
    border-collapse:collapse;
    min-width:100%;
}

.habit-table th,
.habit-table td{
    border:1px solid var(--border);
    text-align:center;
    padding:4px;
    font-size:11px;
}

.habit-table th{
    background:var(--baby2);
    color:var(--navy);
    font-weight:bold;
    min-width:26px;
}

.habit-name-cell{
    text-align:left !important;
    white-space:nowrap;
    font-size:12px;
    font-weight:bold;
    padding:6px 10px !important;
    background:#f8fcfd;
    position:sticky;
    left:0;
    z-index:2;
}

.habit-check{
    width:22px;
    height:22px;
    border-radius:5px;
    border:1px solid var(--border);
    background:white;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    font-weight:bold;
    color:white;
    margin:0 auto;
}

.habit-check:hover{
    background:var(--baby2);
}

.habit-check.done{
    background:var(--green);
    border-color:var(--green);
}

.habit-delete{
    border:0;
    background:#fff0ef;
    color:var(--red);
    border-radius:6px;
    padding:2px 6px;
    font-size:10px;
    font-weight:bold;
    cursor:pointer;
    margin-left:8px;
}

.habit-progress-section{
    margin-top:22px;
}

.habit-progress-title{
    font-size:13px;
    font-weight:bold;
    color:var(--navy);
    margin-bottom:10px;
}

.habit-progress-chart{
    display:flex;
    align-items:flex-end;
    gap:2px;
    height:90px;
    border-bottom:1px solid var(--border);
    min-width:100%;
}

.habit-progress-bar{
    flex:1;
    background:var(--baby);
    border-radius:3px 3px 0 0;
    min-width:6px;
}

.habit-empty{
    text-align:center;
    color:var(--gray);
    padding:30px;
    font-size:13px;
}

    .smart-schedule{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--baby);
    color:var(--navy);
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.smart-schedule:hover{
    background:#a9deed;
}

    /* SMART SCHEDULING */

.smart-result{
    background:var(--baby2);
    border:1px solid var(--border);
    border-radius:12px;
    padding:15px;
    margin-top:15px;
}

.smart-result h3{
    margin-top:0;
}

.smart-result button{
    border:0;
    background:var(--navy);
    color:white;
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.smart-result button:hover{
    background:var(--navy2);
}

.smart-time{
    font-size:20px;
    font-weight:bold;
    color:var(--navy);
    margin:8px 0;
}
    
</style>
</head>


<body>

<header>

    <div>
        <div class="logo">🧠 MindCal</div>
        <div class="subtitle">
            An ADHD-friendly calendar
        </div>
    </div>

    <button id="headerAdd">
        ＋ Add Event
    </button>

</header>


<div class="container">

<div class="layout">


<!-- CALENDAR -->

<div class="card">

    <div class="calendar-top">

    <div class="nav">
        <button id="previousMonth">‹</button>
        <button id="nextMonth">›</button>
    </div>

    <h2 id="monthTitle"></h2>

    <div class="nav">

    <button id="todayButton">
        Today
    </button>

</div>

</div>

<div class="view-switcher">

    <button id="monthViewButton" class="view-button active">
        Month
    </button>

    <button id="weekViewButton" class="view-button">
        Week
    </button>

    <button id="dayViewButton" class="view-button">
        Day
    </button>

    <button id="habitViewButton" class="view-button">
        🎯 Habits
    </button>

</div>


    <div class="weekdays" id="weekdaysRow">

        <div class="weekday">Sun</div>
        <div class="weekday">Mon</div>
        <div class="weekday">Tue</div>
        <div class="weekday">Wed</div>
        <div class="weekday">Thu</div>
        <div class="weekday">Fri</div>
        <div class="weekday">Sat</div>

    </div>


    <div id="calendar" class="calendar"></div>

    <div id="weekCalendar" class="week-calendar" style="display:none;"></div>

    <div id="dayCalendar" class="day-calendar" style="display:none;"></div>

    <div id="habitTracker" class="habit-tracker" style="display:none;"></div>

</div>


<!-- RIGHT SIDE -->

<div>


<div class="card">

    <button class="add-event" id="addEventButton">
    ＋ Add Event
</button>

<button class="smart-schedule" id="smartScheduleButton">
    ✨ Smart Schedule
</button>

    <h3 id="Title"></h3>

    <div id="eventList"></div>

</div>


<br>


<div class="card">

    <h3>🧠 Brain Dump</h3>

    <p style="font-size:12px;color:#627d98;">
        Save ideas here without turning them into calendar events.
    </p>

    <textarea
        id="brainDump"
        placeholder="New screenplay idea... website idea... something you don't want to forget..."></textarea>

    <button class="save-dump" id="saveBrainDump">
        Save Brain Dump
    </button>

    <div id="brainMessage" class="message"></div>

</div>


</div>

</div>

</div>


<!-- EVENT MODAL -->

<div class="modal" id="eventModal">

<div class="modal-box">

    <div class="modal-header">

        <h2>Add Event</h2>

        <button class="close" id="closeModal">
            ×
        </button>

    </div>


    <form id="eventForm">

        <div class="form-grid">


            <div class="form-group full">

                <label>Event Title</label>

                <input
                    id="eventTitle"
                    type="text"
                    placeholder="Example: Write screenplay"
                    required>

            </div>


            <div class="form-group">

                <label>Category</label>

                <select id="eventCategory">

                    <option>Personal</option>
                    <option>Work</option>
                    <option>Study</option>
                    <option>Writing</option>
                    <option>Coding</option>
                    <option>Exercise</option>
                    <option>Social</option>
                    <option>Chores</option>
                    <option>Health</option>
                    <option>Other</option>

                </select>

            </div>


            <div class="form-group">

                <label>Priority</label>

                <select id="eventPriority">

                    <option value="must">
                        🔴 Must Get Done
                    </option>

                    <option value="could">
                        🟡 Could Get Done Today
                    </option>

                    <option value="none" selected>
                        ⚪ Everything Else
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>Start Date</label>

<input
    id="eventStartDate"
    type="date"
    required>

</div>


<div class="form-group">

    <label>End Date</label>

    <input
        id="eventEndDate"
        type="date"

/* =========================================
   SAFE STORAGE
   Some browsers/contexts (Safari on file://
   pages, sandboxed previews, some in-app
   webviews) throw a SecurityError just for
   touching localStorage. Since that would
   happen as the very first thing this script
   does, an uncaught throw here would stop
   every line below it from ever running —
   including every addEventListener call —
   which is why every button would stop
   working at once. These wrappers make sure
   that can never happen: the app just runs
   without persistence instead of not running
   at all.
========================================= */

function safeStorageGet(key){

    try{

        return localStorage.getItem(key);

    }catch(e){

        return null;

    }

}


function safeStorageSet(key, value){

    try{

        localStorage.setItem(key, value);

    }catch(e){

        /* Storage unavailable — data won't
           persist across reloads, but the
           app keeps working this session. */

    }

}


function loadJSON(key, fallback){

    try{

        const raw =
            safeStorageGet(key);

        return raw
            ? JSON.parse(raw)
            : fallback;

    }catch(e){

        return fallback;

    }

}

function getStartOfWeek(date){

    const result = new Date(date);

    const day = result.getDay();

    // Monday = 0
    const difference = day === 0 ? -6 : 1 - day;

    result.setDate(
        result.getDate() + difference
    );

    result.setHours(0,0,0,0);

    return result;
}
