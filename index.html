<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MindCal</title>

<style>

:root{
    --baby:#bfe8f5;
    --baby2:#eaf8fc;
    --navy:#102a43;
    --navy2:#243b53;
    --white:#ffffff;
    --gray:#627d98;
    --border:#d7e8ef;
    --green:#4caf7a;
    --red:#d9534f;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:var(--baby2);
    color:var(--navy);
}

/* HEADER */

header{
    background:var(--navy);
    color:white;
    padding:18px 5%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:25px;
    font-weight:bold;
}

.subtitle{
    font-size:12px;
    opacity:.75;
}

header button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 15px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.container{
    width:94%;
    max-width:1300px;
    margin:25px auto;
}

.layout{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border:1px solid var(--border);
    border-radius:18px;
    padding:20px;
    box-shadow:0 8px 25px rgba(16,42,67,.08);
}

/* CALENDAR */

.calendar-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:15px;
}

.calendar-top h2{
    margin:0;
}

.nav button{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:8px 12px;
    border-radius:8px;
    cursor:pointer;
    font-weight:bold;
}

.weekdays,
.calendar{
    display:grid;
    grid-template-columns:repeat(7,1fr);
}

.weekday{
    text-align:center;
    font-size:12px;
    font-weight:bold;
    color:var(--gray);
    padding:8px 0;
}

.day{
    min-height:105px;
    border:1px solid var(--border);
    padding:6px;
    cursor:pointer;
    background:white;
}

.day:hover{
    background:var(--baby2);
}

.day.today{
    background:#f0fbfe;
}

.day.selected{
    outline:3px solid var(--baby);
}

.day-number{
    font-weight:bold;
    font-size:13px;
    margin-bottom:5px;
}

.event{
    font-size:10px;
    padding:4px;
    margin:3px 0;
    border-radius:5px;
    background:var(--baby);
    overflow:hidden;
    white-space:nowrap;
    text-overflow:ellipsis;
}

.event.completed{
    text-decoration:line-through;
    opacity:.5;
}

.event.cancelled{
    text-decoration:line-through;
    opacity:.35;
}

/* ADD BUTTON */

.add-event{
    width:100%;
    padding:14px;
    border:0;
    border-radius:11px;
    background:var(--navy);
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-bottom:18px;
}

.add-event:hover{
    background:var(--navy2);
}

/* EVENTS */

.event-card{
    background:#f6fbfd;
    border:1px solid var(--border);
    padding:12px;
    border-radius:11px;
    margin-bottom:10px;
}

.event-card h4{
    margin:0 0 5px;
}

.event-info{
    font-size:12px;
    color:var(--gray);
    margin-bottom:8px;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:5px;
}

    .edit{
    background:#dceffc;
    color:var(--navy);
}
    
.actions button{
    border:0;
    border-radius:7px;
    padding:6px 9px;
    font-size:11px;
    font-weight:bold;
    cursor:pointer;
}

.complete{
    background:#ddf5e8;
    color:#217346;
}

.move{
    background:var(--baby);
    color:var(--navy);
}

.cancel{
    background:#fff0ef;
    color:var(--red);
}

.delete{
    background:#eeeeee;
}

/* BRAIN DUMP */

textarea{
    width:100%;
    min-height:130px;
    resize:vertical;
    border:1px solid var(--border);
    border-radius:10px;
    padding:10px;
}

.save-dump{
    border:0;
    background:var(--baby);
    color:var(--navy);
    padding:10px 14px;
    border-radius:8px;
    font-weight:bold;
    cursor:pointer;
    margin-top:8px;
}

.message{
    font-size:12px;
    color:var(--green);
    margin-top:7px;
}

/* MODAL */

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(16,42,67,.55);
    z-index:999;
    align-items:center;
    justify-content:center;
    padding:15px;
}

.modal.show{
    display:flex;
}

.modal-box{
    background:white;
    width:100%;
    max-width:600px;
    max-height:90vh;
    overflow-y:auto;
    border-radius:18px;
    padding:22px;
}

.modal-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.modal-header h2{
    margin-top:0;
}

.close{
    border:0;
    background:none;
    font-size:28px;
    cursor:pointer;
}

.form-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.form-group{
    margin-bottom:10px;
}

.full{
    grid-column:1 / -1;
}

label{
    display:block;
    font-size:12px;
    font-weight:bold;
    margin-bottom:5px;
}

input,
select{
    width:100%;
    padding:10px;
    border:1px solid var(--border);
    border-radius:9px;
    background:white;
}

textarea{
    font-family:Arial,sans-serif;
}

.save-event{
    width:100%;
    border:0;
    background:var(--navy);
    color:white;
    padding:14px;
    border-radius:10px;
    font-weight:bold;
    cursor:pointer;
    margin-top:10px;
}

.audio-preview{
    width:100%;
    margin-top:8px;
}

.empty{
    text-align:center;
    color:var(--gray);
    padding:20px;
    font-size:13px;
}

/* MOBILE */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
    }

}

@media(max-width:550px){

    header{
        flex-direction:column;
        align-items:flex-start;
    }

    .form-grid{
        grid-template-columns:1fr;
    }

    .full{
        grid-column:auto;
    }

    .day{
        min-height:70px;
    }

    .event{
        font-size:9px;
    }

}

    .day-selector{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
}

.day-option{
    display:flex;
    align-items:center;
    gap:5px;
    background:var(--baby2);
    border:1px solid var(--border);
    padding:8px 10px;
    border-radius:8px;
    cursor:pointer;
    font-size:12px;
}

.day-option input{
    width:auto;
}
    
</style>
</head>


<body>

<header>

        <div class="logo">🧠 MindCal</div>
        <div class="subtitle">
            An ADHD-friendly calendar
        </div>
    </div>

    <button id="headerAdd">
        ＋ Add Event
    </button>

</header>


<div class="container">

<div class="layout">


<!-- CALENDAR -->

<div class="card">

    <div class="calendar-top">

<!-- RIGHT SIDE -->

<div>


<div class="card">

    </button>

    <h3 id="selectedTitle"></h3>

    <div id="eventList"></div>

</div>


<br>


<div class="card">

    <h3>🧠 Brain Dump</h3>

    </p>

    </button>

</div>


</div>

</div>

</div>


<!-- EVENT MODAL -->

<div class="modal" id="eventModal">

<div class="modal-box">

    <div class="modal-header">

        <h2>Add Event</h2>

    </div>


    <form id="eventForm">

        <div class="form-grid">


            <div class="form-group full">

            <div class="form-group">

                <label>Category</label>

                    <option>Personal</option>
                    <option>Work</option>
                    <option>Study</option>
                    <option>Writing</option>
                    <option>Coding</option>
                    <option>Exercise</option>
                    <option>Social</option>

                </select>

            </div>


            <div class="form-group">

                <label>Date</label>

                    id="eventDate"

            </div>


            <div class="form-group">

    <label>Time</label>

        </option>

</div>


<div
    class="form-group"
    id="specificTimeGroup">

    <label>Start Time</label>

    <input
        id="eventStart"

</div>


<div
    class="form-group"
    id="endTimeGroup">

</div>

                <label>Description</label>

            <!-- CUSTOM REPEAT OPTIONS -->

<div

    <div class="day-selector">

        <label class="day-option">

        <label class="day-option">
            <input
                type="checkbox"

        <label class="day-option">
            <input
                type="checkbox"
                value="2"
                class="repeat-day">
            Tue
        </label>

        <label class="day-option">
            <input
                type="checkbox"
                value="3"

            Wed

            <input
                type="checkbox"

            Thu

                type="checkbox"

        </label>

        <input

            min="1"
            placeholder="Example: 10">

    </div>

</div>

            <div class="form-group">

                <label>Alarm</label>

                <select id="alarmType">

                    <option value="none">
                        No alarm
                    </option>

                    <option value="default">
                        Default alarm
                    </option>

                    <option value="custom">
                        Upload music/audio
                    </option>

                </select>

            </div>


            <div
                class="form-group full"
                id="audioGroup"
                style="display:none;">

                <label>Upload Alarm Music</label>

                <input
                    id="audioFile"
                    type="file"
                    accept="audio/*">

                <audio
                    id="audioPreview"
                    class="audio-preview"
                    controls

                </audio>

            </div>


        </div>


        <button

            type="submit">

            Save Event

        </button>

    </form>

</div>

</div>


<script>

/* =========================================
   DATA
========================================= */

let events =
    JSON.parse(
        localStorage.getItem("mindcal_events")
    ) || [];


let brainDump =
    localStorage.getItem(
        "mindcal_brain_dump"
    ) || "";


let currentDate = new Date();

let selectedDate = new Date();

let uploadedAudio = null;


/* =========================================
   ELEMENTS
========================================= */

const calendar =
    document.getElementById("calendar");

const modal =
    document.getElementById("eventModal");

const eventForm =
    document.getElementById("eventForm");

const brainDumpBox =
    document.getElementById("brainDump");


brainDumpBox.value = brainDump;


/* =========================================
   DATE FUNCTION
========================================= */

function getDateKey(date){

    let year =
        date.getFullYear();

    let month =
        String(
            date.getMonth() + 1
        ).padStart(2,"0");

    let day =
        String(
            date.getDate()
        ).padStart(2,"0");

    return `${year}-${month}-${day}`;

}


/* =========================================
   SAVE DATA
========================================= */

function saveEvents(){

    localStorage.setItem(
        "mindcal_events",
        JSON.stringify(events)
    );

}

    function getCustomRepeatSettings(){

    const days = [];

    document
    .querySelectorAll(".repeat-day:checked")
    .forEach(function(checkbox){

        days.push(
            Number(checkbox.value)
        );

    });


    return {

        days: days,

        endType:
            document.getElementById(
                "repeatEndType"
            ).value,

        endDate:
            document.getElementById(
                "repeatEndDate"
            ).value,

        occurrences:
            document.getElementById(
                "repeatOccurrences"
            ).value

    };

}


/* =========================================
   RENDER CALENDAR
========================================= */

function renderCalendar(){

    calendar.innerHTML = "";

    const year =
        currentDate.getFullYear();

    const month =
        currentDate.getMonth();


    document.getElementById(
        "monthTitle"
    ).textContent =
        currentDate.toLocaleDateString(
            undefined,
            {
                month:"long",
                year:"numeric"
            }
        );


    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();


    const days =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    for(
        let i = 0;
        i < 42;
        i++
    ){

        const number =
            i - firstDay + 1;


        const cellDate =
            new Date(
                year,
                month,
                number
            );


        const cell =
            document.createElement("div");


        cell.className = "day";


        const key =
            getDateKey(cellDate);


        if(
            key ===
            getDateKey(new Date())
        ){

            cell.classList.add("today");

        }


        if(
            key ===
            getDateKey(selectedDate)
        ){

            cell.classList.add("selected");

        }


        const numberElement =
            document.createElement("div");


        numberElement.className =
            "day-number";


        numberElement.textContent =
            cellDate.getDate();


        cell.appendChild(
            numberElement
        );


        const dayEvents =
            getEventsForDate(key);


        dayEvents
        .slice(0,4)
        .forEach(function(event){

            const eventElement =
                document.createElement("div");


            eventElement.className =
                "event";


            if(
                event.status ===
                "completed"
            ){

                eventElement.classList.add(
                    "completed"
                );

            }


            if(
                event.status ===
                "cancelled"
            ){

                eventElement.classList.add(
                    "cancelled"
                );

            }


            let displayTime = "";

if(event.timeType === "morning"){
    displayTime = "🌅 ";
}

else if(event.timeType === "afternoon"){
    displayTime = "☀️ ";
}

else if(event.timeType === "evening"){
    displayTime = "🌆 ";
}

else if(event.timeType === "night"){
    displayTime = "🌙 ";
}

else if(event.timeType === "flexible"){
    displayTime = "🧠 ";
}

else if(event.timeType === "all-day"){
    displayTime = "📅 ";
}

else if(event.start){
    displayTime = event.start + " ";
}


eventElement.textContent =
    displayTime + event.title;


            cell.appendChild(
                eventElement
            );

        });


        cell.addEventListener(
            "click",
            function(){

                selectedDate =
                    new Date(cellDate);

                renderCalendar();

                renderEvents();

            }
        );


        calendar.appendChild(cell);

    }

}


/* =========================================
   GET EVENTS
========================================= */

function getEventsForDate(date){

    return events.filter(
        function(event){

            if(
                event.date === date
            ){

                return true;

            }


            if(
                event.repeat === "daily"
            ){

                return (
                    new Date(date) >=
                    new Date(event.date)
                );

            }


            if(
                event.repeat === "weekly"
            ){

                const start =
                    new Date(
                        event.date
                    );

                const current =
                    new Date(
                        date
                    );


                const difference =
                    Math.floor(
                        (
                            current -
                            start
                        ) /
                        86400000
                    );


                return (
                    difference >= 0 &&
                    difference % 7 === 0
                );

            }


            if(
                event.repeat === "monthly"
            ){

                const start =
                    new Date(
                        event.date
                    );

                const current =
                    new Date(
                        date
                    );


                return (
                    current >= start &&
                    current.getDate() ===
                    start.getDate()
                );

            }


            return false;

        }
    );

}


/* =========================================
   RENDER EVENT LIST
========================================= */

function renderEvents(){

    const key =
        getDateKey(selectedDate);


    document.getElementById(
        "selectedTitle"
    ).textContent =
        selectedDate.toLocaleDateString(
            undefined,
            {
                weekday:"long",
                month:"long",
                day:"numeric",
                year:"numeric"
            }
        );


    const list =
        document.getElementById(
            "eventList"
        );


    list.innerHTML = "";


    const dayEvents =
        getEventsForDate(key);


    if(
        dayEvents.length === 0
    ){

        list.innerHTML =
            `<div class="empty">
                No events scheduled.
            </div>`;

        return;

    }


    dayEvents.forEach(
        function(event){

            const card =
                document.createElement(
                    "div"
                );


            card.className =
                "event-card";


            let time = "";

            if(event.start){

                time += event.start;

            }

            if(event.end){

                time +=
                    " – " +
                    event.end;

            }


            card.innerHTML = `

                <h4>
                    ${escapeHTML(event.title)}
                </h4>

                <div class="event-info">

                    ${escapeHTML(event.category)}

                    ${time ? " · " + time : ""}

                </div>

                ${
                    event.description
                    ?
                    `<div style="
                        font-size:13px;
                        margin-bottom:8px;
                    ">
                        ${escapeHTML(
                            event.description
                        )}
                    </div>`
                    :
                    ""
                }


                <div class="actions">

<button
    class="edit"
    data-id="${event.id}"
    data-action="edit">

    ✏️ Edit

</button>

                    <button
                        class="complete"
                        data-id="${event.id}"
                        data-action="complete">

                        ✓ Complete

                    </button>


                    <button
                        class="move"
                        data-id="${event.id}"
                        data-action="move">

                        ↪ Move

                    </button>


                    <button
                        class="cancel"
                        data-id="${event.id}"
                        data-action="cancel">

                        ✕ Cancel

                    </button>


                    <button
                        class="delete"
                        data-id="${event.id}"
                        data-action="delete">

                        🗑 Delete

                    </button>

                </div>
            `;


            list.appendChild(card);

        }
    );

}


/* =========================================
   EVENT BUTTON ACTIONS
========================================= */

document
.getElementById("eventList")
.addEventListener(
    "click",
    function(e){

        const button =
            e.target.closest("button");


        if(!button) return;


        const id =
            button.dataset.id;


        const action =
            button.dataset.action;


        const event =
            events.find(
                function(item){
                    return item.id === id;
                }
            );


        if(!event) return;

if(
    action ===
    "edit"
){

    openEditModal(event);

    return;

}
        
        if(
            action ===
            "complete"
        ){

            event.status =
                "completed";

        }


        if(
            action ===
            "cancel"
        ){

            event.status =
                "cancelled";

        }


        if(
            action ===
            "delete"
        ){

            if(
                confirm(
                    "Delete this event permanently?"
                )
            ){

                events =
                    events.filter(
                        function(item){
                            return item.id !== id;
                        }
                    );

            }

        }


        if(
            action ===
            "move"
        ){

            const newDate =
                prompt(
                    "Move event to date:\n\nYYYY-MM-DD",
                    event.date
                );


            if(newDate){

                event.date =
                    newDate;

                event.status =
                    "moved";

                event.moved =
                    (event.moved || 0) + 1;

            }

        }


        saveEvents();

        renderCalendar();

        renderEvents();

    }
);


/* =========================================
   MODAL
========================================= */

function openModal(){

    modal.classList.add("show");


    document.getElementById(
        "eventDate"
    ).value =
        getDateKey(selectedDate);

}


function closeModal(){

    modal.classList.remove(
        "show"
    );


    eventForm.reset();


    /* Clear edit mode */

    delete eventForm.dataset.editingId;


    uploadedAudio = null;


    /* Change title back to Add Event */

    document.querySelector(
        ".modal-header h2"
    ).textContent =
        "Add Event";


    /* Hide custom audio */

    document.getElementById(
        "audioGroup"
    ).style.display =
        "none";


    document.getElementById(
        "audioPreview"
    ).style.display =
        "none";


    /* Reset time fields */

    if(
        typeof updateTimeFields ===
        "function"
    ){

        updateTimeFields();

    }

}

document

);


document
.getElementById("headerAdd")

);


document
.getElementById("closeModal")

);

    document.getElementById(

    document.getElementById(

        "eventRepeat"

/* =========================================

========================================= */

const timeType =
    document.getElementById("timeType");

const specificTimeGroup =
    document.getElementById("specificTimeGroup");

const endTimeGroup =
    document.getElementById("endTimeGroup");


function updateTimeFields(){

    if(timeType.value === "specific"){

        specificTimeGroup.style.display =
            "block";

        endTimeGroup.style.display =
            "block";

    }else{

        specificTimeGroup.style.display =

        endTimeGroup.style.display =
            "none";

    }

}


timeType.addEventListener(

    updateTimeFields
);

/* =========================================
   AUDIO UPLOAD
========================================= */

document
.getElementById("audioFile")
.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];


        if(!file) return;


        const reader =
            new FileReader();


        reader.onload =
            function(e){

                uploadedAudio =
                    e.target.result;


                const preview =
                    document.getElementById(
                        "audioPreview"
                    );


                preview.src =
                    uploadedAudio;


                preview.style.display =
                    "block";

            };


        reader.readAsDataURL(file);

    }
);


/* =========================================
   SAVE EVENT
========================================= */

eventForm.addEventListener(
    "submit",
    function(e){

        e.preventDefault();


        const title =
            document.getElementById(
                "eventTitle"
            ).value.trim();


        const date =
            document.getElementById(
                "eventDate"
            ).value;


        if(!title){

            alert(
                "Please enter an event title."
            );

            return;

        }


        if(!date){

            alert(
                "Please choose a date."
            );

            return;

        }


        const editingId =
            eventForm.dataset.editingId;


        /* =================================
           EDIT EXISTING EVENT
        ================================= */

        if(editingId){

            const event =
                events.find(
                    function(item){

                        return item.id ===
                            editingId;

                    }
                );


            if(event){

                event.title =
                    title;

                event.category =
                    document.getElementById(
                        "eventCategory"
                    ).value;

                event.date =
                    date;

                event.start =
                    document.getElementById(
                        "eventStart"
                    ).value;

                event.end =
                    document.getElementById(
                        "eventEnd"
                    ).value;

                event.description =
                    document.getElementById(
                        "eventDescription"
                    ).value;

                event.repeat =
                    document.getElementById(
                        "eventRepeat"
                    ).value;

                event.alarm =
                    document.getElementById(
                        "alarmType"
                    ).value;

                event.audio =
                    uploadedAudio;

            }


            delete eventForm.dataset.editingId;


            saveEvents();


            selectedDate =
                new Date(
                    date + "T00:00:00"
                );


            currentDate =
                new Date(
                    date + "T00:00:00"
                );


            closeModal();


            renderCalendar();

            renderEvents();


            alert(
                "Event updated! ✏️"
            );


            return;

        }


        /* =================================
           CREATE NEW EVENT
        ================================= */

        const newEvent = {

            id:
                Date.now().toString(),

            title:
                title,

            category:
                document.getElementById(
                    "eventCategory"
                ).value,

            date:
                date,

            start:
                document.getElementById(
                    "eventStart"
                ).value,

            end:
                document.getElementById(
                    "eventEnd"
                ).value,

            description:
                document.getElementById(
                    "eventDescription"
                ).value,

            repeat:
                document.getElementById(
                    "eventRepeat"
                ).value,

                    customRepeat:
    getCustomRepeatSettings(),

            alarm:
                document.getElementById(
                    "alarmType"
                ).value,

            audio:
                uploadedAudio,

            status:
                "scheduled",

            moved:
                0

        };


        events.push(
            newEvent
        );


        saveEvents();


        selectedDate =
            new Date(
                date + "T00:00:00"
            );


        currentDate =
            new Date(
                date + "T00:00:00"
            );


        closeModal();


        renderCalendar();

        renderEvents();


        alert(
            "Event saved successfully! 📅"
        );

    }
);

/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text){

    return String(text)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");

}
